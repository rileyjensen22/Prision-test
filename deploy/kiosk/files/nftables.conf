#!/usr/sbin/nft -f
# ISD kiosk: nothing in, and out only to the ISD server, the name server and the time server.
flush ruleset

table inet isd_kiosk {
  set server_v4 { type ipv4_addr; elements = { @SERVER_V4@ } }
  set resolver_v4 { type ipv4_addr; elements = { @RESOLVER_V4@ } }
  set ntp_v4 { type ipv4_addr; elements = { @NTP_V4@ } }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip protocol icmp icmp type { echo-request } limit rate 5/second accept
@SSH_RULE@
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    ip daddr @resolver_v4 udp dport 53 accept
    ip daddr @resolver_v4 tcp dport 53 accept
    ip daddr @ntp_v4 udp dport 123 accept
    ip daddr @server_v4 tcp dport 443 accept
  }
}
