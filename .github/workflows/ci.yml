name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres_dev_only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "api[dev]"
      - run: PGPASSWORD=postgres_dev_only psql -h localhost -U postgres -q -f scripts/db-init.sql
      - run: ruff check api scripts && ruff format --check api scripts
      - run: cd api && pytest -q
      - name: No secrets in the repository
        run: python scripts/check-secrets.py
      - name: Dependency audit (Python)
        run: pip install pip-audit && pip-audit --skip-editable
      - name: Simulated week (every invariant must hold)
        run: python scripts/simulate-week.py
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres_dev_only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e "api[dev]"
      - run: PGPASSWORD=postgres_dev_only psql -h localhost -U postgres -q -f scripts/db-init.sql
      - run: cd web && npm ci && npm run lint && npm test
      - name: Dependency audit (production dependencies)
        run: cd web && npm audit --omit=dev
      - run: cd web && npx playwright install --with-deps chromium && npm run e2e
