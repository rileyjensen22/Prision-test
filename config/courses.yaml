# Education settings. The courses themselves are folders under content/courses (docs/courses.md):
# adding a course means adding a folder, not changing code. `make courses-check` validates them.
version: 2
# Which points event each course level earns (kinds are defined in points.yaml). A course can
# override this with "points_kind" in its course.json.
points_by_level: {basic: basic_course, advanced: advanced_course, program: program_certificate}
# Quiz integrity. Questions are drawn at random from each course's bank and the choices shuffled.
# These limits only pace the quiz; they never close the lessons. A course can override
# draw, max_attempts and cooldown_minutes in its course.json.
quiz_defaults:
  draw: 5               # questions per attempt (never more than the bank has)
  max_attempts: 5       # attempts allowed in window_hours
  window_hours: 24
  cooldown_minutes: 10  # wait after a failed attempt
  quiz_minutes: 30      # an open quiz can be resumed for this long
